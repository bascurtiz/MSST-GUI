    - 129
  dim_head: 64
  heads: 8
  attn_dropout: 0.
  ff_dropout: 0.
  flash_attn: true
  dim_freqs_in: 1025
  stft_n_fft: 2048
  stft_hop_length: 512
  stft_win_length: 2048
  stft_normalized: false
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: false
  mlp_expansion_factor: 4
  use_torch_checkpoint: true # it allows to greatly reduce GPU memory consumption during training (not fully tested)
  skip_connection: false # Enable skip connection between transformer blocks - can solve problem with gradients and probably faster training

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments:
  - vocals
  - other
  lr: 5.0e-7
  patience: 4
  reduce_factor: 0.95
  target_instrument: vocals
  num_epochs: 1000
  num_steps: 20
  q: 0.95
  coarse_loss_clip: false
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: true
  
augmentations:
  enable: true
  loudness: true
  loudness_min: 0.1
  loudness_max: 1.5
 
  all:
    channel_shuffle: 0.5
    random_inverse: 0.5
    random_polarity: 0.5
    seven_band_parametric_eq: 0.5
    seven_band_parametric_eq_min_gain_db: -8
    seven_band_parametric_eq_max_gain_db: 8
    mp3_compression: 0.1
    mp3_compression_min_bitrate: 96
    mp3_compression_max_bitrate: 320
    mp3_compression_backend: "lameenc"

inference:
  batch_size: 2
  dim_t: 1536
  num_overlap: 2
  normalize: false
