  attn_dropout: 0.
  ff_dropout: 0.
  flash_attn: true
  dim_freqs_in: 1025
  stft_n_fft: 2048
  stft_hop_length: 441
  stft_win_length: 2048
  stft_normalized: false
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: false
  mlp_expansion_factor: 4
  use_torch_checkpoint: true 
  skip_connection: false
  
training:
  batch_size: 1
  gradient_accumulation_steps: 1
  grad_clip: 1
  instruments: ['strings', 'other']
  lr: 1.0e-6
  patience: 5
  reduce_factor: 0.95 
  target_instrument: null
  num_epochs: 1000
  num_steps: 100 
  q: 0.90
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: False
  use_amp: true
  
augmentations:
  enable: true
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5
 
  all:
    random_inverse: 0.1
    random_polarity: 0.5
    channel_shuffle: 0.5
    seven_band_parametric_eq: 0.5
    seven_band_parametric_eq_min_gain_db: -8
    seven_band_parametric_eq_max_gain_db: 0
    mp3_compression: 0.1
    mp3_compression_min_bitrate: 96
    mp3_compression_max_bitrate: 320
    mp3_compression_backend: "lameenc"
    pedalboard_distortion: 0.01
    pedalboard_distortion_drive_db_min: 1.0
    pedalboard_distortion_drive_db_max: 6.0
    pedalboard_bitcrash: 0.01
    pedalboard_bitcrash_bit_depth_min: 4
    pedalboard_bitcrash_bit_depth_max: 16

inference:
  batch_size: 2
  dim_t: 1251
  num_overlap: 4
  normalize: false
